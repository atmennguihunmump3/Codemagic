name: syncplan_app
description: "SyncPlan Mobile App for SES Polymer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 核心：三大核心依赖库（对应你的 Service 和 Helper）
  googleapis: ^13.0.0
  googleapis_auth: ^1.4.0
  flutter_secure_storage: ^9.0.0
  
  # UI与工具插件（对应你的组件与路由）
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
