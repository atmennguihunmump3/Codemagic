name: SyncPlan Flutter Build
workflows:
  flutter-android-apk:
    name: Build Android APK
    instance_type: mac_mini_m1
    environment:
      flutter: "3.19.6"
    working_directory: .
    scripts:
      - name: Override broken Groovy file BEFORE compile
        script: |
          cp -f flutter_tools/gradle/src/main/groovy/flutter.groovy /Users/builder/programs/flutter/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy
          echo "✅ Replaced broken flutter.groovy"
      - name: Flutter Clean
        script: flutter clean
      - name: Install Dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
