name: SyncPlan Flutter Build
workflows:
  flutter-android-apk:
    name: Build Android APK
    instance_type: mac_mini
    environment:
      flutter: "3.22.0"
    working_directory: .
    scripts:
      - name: Ensure Flutter 3.22.0
        script: |
          flutter channel stable
          flutter downgrade v3.22.0
          flutter --version
      - name: Flutter Clean
        script: flutter clean
      - name: Install Dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
