name: SyncPlan Flutter Build
workflows:
  flutter-android-apk:
    name: Build Android APK
    instance_type: mac_mini_m1
    environment:
      flutter: "3.19.6"
    working_directory: .
    scripts:
      - name: Pin Flutter to exact version
        script: |
          flutter channel stable
          flutter version v3.19.6
          flutter --version
      - name: Flutter Clean
        script: flutter clean
      - name: Install Dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
