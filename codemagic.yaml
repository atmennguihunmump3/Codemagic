workflows:
  flutter-android-apk:
    name: Build Android APK
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.0
    scripts:
      - name: Flutter Clean
        script: flutter clean
      - name: Install Dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
