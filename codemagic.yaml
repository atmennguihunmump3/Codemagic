name: SyncPlan Flutter Build
workflows:
  flutter-android-apk:
    name: Build Android APK
    instance_type: mac_mini_m2
    environment:
      flutter: "3.19.0"
    working_directory: .
    scripts:
      - name: Use pre-installed Flutter 3.19.0
        script: |
          ls -la /Users/builder/flutter/
          if [ -d "/Users/builder/flutter/3.19.0" ]; then
            export PATH="/Users/builder/flutter/3.19.0/bin:$PATH"
            flutter --version
          fi
      - name: Flutter Clean
        script: flutter clean
      - name: Get Dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
