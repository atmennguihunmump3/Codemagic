name: SyncPlan Flutter Build
workflows:
  flutter-android-apk:
    name: Build Android APK
    instance_type: mac_mini_m2
    environment:
      flutter: "3.22.0"          # ← 必须用引号！3.22.0 是最后一个完全兼容版
      gradle: "8.3"              # ← 锁定 Gradle 版本，防止自动升级到不兼容版
    working_directory: .
    scripts:
      - name: Show Flutter Version
        script: flutter --version
      - name: Flutter Clean
        script: flutter clean
      - name: Force Downgrade Flutter
        script: flutter version 3.22.0
      - name: Install Dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
