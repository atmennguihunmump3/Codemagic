plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.syncplan.syncplan_app"
    compileSdk 34

    defaultConfig {
        applicationId "com.syncplan.syncplan_app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }
}

// 终极强制补丁：强制整个项目以 v2 模式编译，绕过清单检测
project.ext {
    flutterEmbeddingVersion = 2
}
